<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Roles</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">

    <h2 th:text="${titulo}" class="mb-4 text-primary"></h2>

    <table class="table table-striped table-hover shadow-sm">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nombre del Rol</th>
                <th>Descripción</th>
                <th>Estado</th>
                <th>Fecha Creación</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="r : ${roles}">
                <td th:text="${r.id}"></td>
                <td th:text="${r.nomRol}"></td>
                <td th:text="${r.descripcion}"></td>
                <td>
                    <span th:if="${r.estado}" class="badge bg-success">Activo</span>
                    <span th:unless="${r.estado}" class="badge bg-danger">Inactivo</span>
                </td>
                <td th:text="${#dates.format(r.fechaCreacion, 'dd/MM/yyyy')}"></td>
            </tr>
        </tbody>
    </table>

</body>
</html>
